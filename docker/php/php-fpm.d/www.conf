[www]
; Escucha en todas las interfaces de la red interna de Docker (no se publica al host)
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; Endpoint de vida para el healthcheck del contenedor
ping.path = /ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.suppress_path[] = /ping
