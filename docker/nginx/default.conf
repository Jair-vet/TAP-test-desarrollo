# =============================================================================
# Nginx: sirve la SPA de Angular (estáticos) y hace de gateway hacia la API.
#
#   /            → Angular (dist) con fallback a index.html
#   /api/        → Laravel (php-fpm, contenedor api)
#   /docs/       → Swagger UI + openapi.yaml
#   /mail/       → Mailpit (correos de prueba; acceso con cookie firmada, ver /correos)
#
# Un solo origen (mismo dominio para front y API): sin CORS, cookies
# SameSite=Strict funcionando y una sola URL pública en el túnel.
# =============================================================================

# Esquema real: el túnel de Cloudflare manda X-Forwarded-Proto=https
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}
# HSTS solo cuando el cliente llegó por HTTPS (no rompe http://localhost)
map $fwd_proto $hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Redirecciones relativas: conservan host y puerto del cliente (localhost:8080, túnel HTTPS)
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Compresión (Brotli lo aplica además Cloudflare en el borde)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/yaml text/yaml;

    # ---------------------------------------------------------------- API
    # ^~ = coincidencia de prefijo con prioridad sobre las regex (estáticos .js/.css)
    location ^~ /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        include /etc/nginx/snippets/php-api.conf;
    }

    location = /up {
        include /etc/nginx/snippets/php-api.conf;
    }

    # ------------------------------------------------------- Swagger UI
    location ^~ /docs/ {
        alias /usr/share/nginx/docs/;
        index index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /docs {
        return 301 /docs/;
    }

    # --------------------------------------------------------- Mailpit
    # Protegido con auth_request: antes de servir cualquier recurso de /mail/,
    # Nginx pregunta a la API si la cookie firmada `tap_mail` es válida.
    # Sin cookie → redirige a /correos (pantalla de acceso con el diseño del
    # sistema) en lugar del diálogo nativo de autenticación básica.
    location ^~ /mail/ {
        auth_request /_mailbox_verify;
        error_page 401 = @mailbox_login;

        proxy_pass http://mailpit:8025;
        proxy_http_version 1.1;
        # $http_host conserva el puerto (localhost:8080): Mailpit compara Origin vs Host
        # al abrir el WebSocket de avisos en vivo; con $host (sin puerto) respondía 403.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 1h;
    }

    # Subpetición interna: GET /api/v1/mailbox/verify con las cookies originales
    location = /_mailbox_verify {
        internal;
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI /api/v1/mailbox/verify;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param QUERY_STRING "";
        fastcgi_param CONTENT_TYPE "";
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param HTTP_X_FORWARDED_PROTO $fwd_proto;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass_request_body off;
    }

    location @mailbox_login {
        return 302 /correos?next=$uri;
    }

    # ------------------------------------------- Estáticos con hash (Angular)
    # main-ABC123.js cambia de nombre en cada build → caché de 1 año, inmutable
    location ~* \.(?:js|mjs|css|woff2?|ttf|svg|png|jpe?g|webp|ico|map)$ {
        include /etc/nginx/snippets/security-headers.conf;
        # sin "always": un 404 nunca debe quedar cacheado como inmutable
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------- SPA Angular
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-app.conf;
        # index.html nunca se cachea: así siempre apunta al último build
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
