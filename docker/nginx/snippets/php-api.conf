# Todo /api/* entra por el front controller de Laravel (public/index.php).
# Nginx no necesita los archivos PHP: solo reenvía por FastCGI al contenedor api.
include fastcgi_params;
fastcgi_pass api:9000;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
fastcgi_param HTTP_X_FORWARDED_PROTO $fwd_proto;
fastcgi_param HTTP_PROXY "";            # mitigación httpoxy
fastcgi_hide_header X-Powered-By;
fastcgi_read_timeout 60s;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
